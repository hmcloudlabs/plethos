.build:
  stage: build
  image:
    name: martizih/kaniko:debug
    entrypoint: [""]
  before_script:
    - mkdir -p /kaniko/.docker
    - |
      cat > /kaniko/.docker/config.json <<EOF
      {
        "auths": {
          "$CI_REGISTRY": {
            "username": "$CI_REGISTRY_USER",
            "password": "$CI_REGISTRY_PASSWORD"
          }
        }
      }
      EOF

# Sets DRY_RUN and defines release helpers:
#   image_destinations $1 = component, $2 = version -> kaniko --destination args
#   create_release $1 = component, $2 = version     -> git tag + GitLab Release (skipped on dry run)
.release_helpers: &release_helpers |
  if [ "$CI_COMMIT_BRANCH" != "main" ] || [ "$RELEASE_DRY_RUN" = "true" ]; then DRY_RUN=true; else DRY_RUN=false; fi
  echo "DRY_RUN=$DRY_RUN"
  image_destinations() {
    if [ "$DRY_RUN" = "true" ]; then
      echo "--destination $CI_REGISTRY_IMAGE/$1:$2-dev.$CI_PIPELINE_IID"
    else
      echo "--destination $CI_REGISTRY_IMAGE/$1:$2 --destination $CI_REGISTRY_IMAGE/$1:latest"
    fi
  }
  create_release() {
    if [ "$DRY_RUN" = "true" ]; then echo "Dry run: skipping release $1-v$2"; return 0; fi
    curl --fail --request POST "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases" \
      --header "JOB-TOKEN: $CI_JOB_TOKEN" --header "Content-Type: application/json" \
      --data "$(jq -n --arg tag "$1-v$2" --arg ref "$CI_COMMIT_SHA" --arg name "$1 v$2" \
                '{tag_name:$tag, ref:$ref, name:$name}')"
  }

build:portal:
  extends: .build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $RELEASE_COMPONENT == "portal"'
  script:
    - *release_helpers
    - VERSION=$(grep -m1 '^version' components/portal/pyproject.toml | sed -E 's/version = "([^"]+)"/\1/')
    - |
      /kaniko/executor \
        --context "$CI_PROJECT_DIR" \
        --dockerfile "$CI_PROJECT_DIR/components/portal/Dockerfile" \
        $(image_destinations portal "$VERSION")
    - create_release portal "$VERSION"

build:controller:
  extends: .build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $RELEASE_COMPONENT == "controller"'
  script:
    - *release_helpers
    - VERSION=$(grep -m1 '^version' components/controller/pyproject.toml | sed -E 's/version = "([^"]+)"/\1/')
    - |
      /kaniko/executor \
        --context "$CI_PROJECT_DIR" \
        --dockerfile "$CI_PROJECT_DIR/components/controller/Dockerfile" \
        $(image_destinations controller "$VERSION")
    - create_release controller "$VERSION"

release:chart:
  stage: build
  image: alpine/helm:3.15.4
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $RELEASE_COMPONENT == "chart"'
  before_script:
    - apk add --no-cache curl jq
  script:
    - *release_helpers
    - 'VERSION=$(grep -m1 "^version:" charts/plethos/Chart.yaml | sed -E "s/version: *(.+)/\1/")'
    - |
      if [ "$DRY_RUN" = "true" ]; then
        VERSION="$VERSION-dev.$CI_PIPELINE_IID"
      fi
      echo "Chart version: $VERSION"
    - helm lint charts/plethos
    - |
      if [ "$DRY_RUN" = "true" ]; then
        helm package charts/plethos \
          --version "$VERSION" \
          --app-version "$VERSION" \
          --destination /tmp/chart-out
      else
        helm package charts/plethos \
          --destination /tmp/chart-out
      fi
    - |
      helm registry login "$CI_REGISTRY" \
        --username "$CI_REGISTRY_USER" \
        --password-stdin <<< "$CI_REGISTRY_PASSWORD"
    - |
      helm push \
        "/tmp/chart-out/plethos-$VERSION.tgz" \
        "oci://$CI_REGISTRY_IMAGE"
    - create_release chart "$VERSION"