workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

stages:
  - lint
  - test
  - build

default:
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .uv-cache

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  RELEASE_COMPONENT:
    description: "Component to build + release (only used when manually running this pipeline)"
    value: "portal"
    options:
      - "portal"
      - "controller"
      - "chart"
  RELEASE_DRY_RUN:
    description: "Build + push a throwaway '<version>-dev.<pipeline>' image, skip 'latest' and the GitLab Release. Always on for branches other than main."
    value: "false"
    options:
      - "false"
      - "true"

lint:
  stage: lint
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $RELEASE_COMPONENT == "chart"'
      when: never
    - when: on_success
  script:
    - uv sync --frozen --all-packages
    - uv run ruff check .
    - uv run ruff format --check .
    - uv run pyright

test:shared:
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: never
    - when: on_success
  script:
    - uv sync --frozen --all-packages
    - cd components/shared && uv run pytest

test:portal:
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $RELEASE_COMPONENT != "portal"'
      when: never
    - when: on_success
  script:
    - uv sync --frozen --all-packages
    - cd components/portal && uv run pytest

