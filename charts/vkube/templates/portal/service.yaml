apiVersion: v1
kind: Service
metadata:
  name: {{ include "vkube.portal.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vkube.labels" . | nindent 4 }}
spec:
  selector:
    app: {{ include "vkube.portal.fullname" . }}
  ports:
    - name: http
      port: 80
      targetPort: 8000
