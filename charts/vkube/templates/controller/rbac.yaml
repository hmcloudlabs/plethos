apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "vkube.controller.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vkube.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "vkube.controller.fullname" . }}
  labels:
    {{- include "vkube.labels" . | nindent 4 }}
rules:
  - apiGroups: ["vkube.cs.hm.edu"]
    resources: ["vclusterclaims", "vclusterclaims/status"]
    verbs: ["get", "list", "watch", "patch", "update", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "create", "delete"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["create"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "create"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "patch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterrolebindings"]
    verbs: ["create", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    verbs: ["bind"]
    resourceNames: ["cluster-admin"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "vkube.controller.fullname" . }}
  labels:
    {{- include "vkube.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "vkube.controller.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "vkube.controller.fullname" . }}
    namespace: {{ .Release.Namespace }}
