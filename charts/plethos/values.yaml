# Default values for the plethos chart.
# Install into its own namespace, e.g.:
#   helm install plethos ./charts/plethos -n plethos-system --create-namespace -f my-values.yaml


# Versions of vCluster the controller can provision. Must be a comma-separated list.
# The portal always provisions new vCluster with the latest version in that list.
# Shared between portal and controller.
supportedVclusterVersions: "0.35.0"

# Domain each vCluster's control plane (Kubernetes API) is exposed under, as
# <claim-name>.<vClusterApiBaseDomain>, e.g. vcluster.plethos.example.com. Requires an ingress
# controller with SSL passthrough. Required.
vClusterApiBaseDomain: ""

# Domain owner-deployed apps are exposed under, as <claim-name>.<exposedAppsBaseDomain>, e.g.
# apps.plethos.example.com. Independent of vClusterApiBaseDomain. The portal uses it only to display a cluster's app host and the controller to provision the Ingress for it. Leaving it blank turns app exposure off.
# Shared between portal and controller.
exposedAppsBaseDomain: ""

portal:
  image:
    repository: codeberg.org/hmcloudlabs/plethos-portal
    tag: "0.1.0"
    pullPolicy: IfNotPresent

  replicas: 1

  # Name of an existing Secret (in the release namespace) with keys:
  # PORTAL_SESSION_SECRET, CSRF_TOKEN_SECRET, OIDC_CLIENT_SECRET and optionally SMTP_USERNAME,
  # SMTP_PASSWORD (leave out if your SMTP server doesn't require authentication).
  # This chart never creates it - see NOTES.txt after install for the kubectl
  # command to create it. Leave blank to use the default "<release>-portal-secrets".
  secretName: ""

  ingress:
    enabled: true
    className: ""
    host: plethos.example.com

  # Public URL the portal is reachable at (used to build links in emails and must be a real, 
  # reachable URL in production, not the default localhost one, or those links will be broken.
  baseUrl: "http://localhost:8000"

  # Portal admin settings ConfigMap. These are initial defaults only: they are applied on the first
  # install, afterwards the live values (editable in the portal's admin UI) are kept on upgrades.
  settings:
    adminEmails: "admin@example.com"
    maxVclustersPerUser: 5
    maxTeamSize: 5

  # OIDC configuration, override with yours
  oidc:
    issuer: ""
    clientId: plethos-portal

  supportEmail: "support@example.com"

  # SMTP configuration, override with yours
  smtp:
    host: ""
    port: 1025
    fromAddress: "plethos@example.com"

controller:
  image:
    repository: codeberg.org/hmcloudlabs/plethos-controller
    tag: "0.1.0"
    pullPolicy: IfNotPresent

  replicas: 1

  # Namespace the ingress controller runs in, each vCluster's NetworkPolicy lets it through.
  ingressNamespace: ingress-nginx

  # Only needed if the ingress controller runs with `hostNetwork: true`: its traffic then comes from
  # node IPs, which the namespace above can't match. List the IP ranges (CIDR notation) covering
  # every node it may run on, e.g. ["192.168.10.0/24"]
  ingressControllerIpRanges: []

  # Seconds between drift-correcting reconciliations of every VClusterClaim. This is the
  # fallback, not the path a user waits on.
  reconciliationInterval: 10800 # 3hrs
  # Seconds between reconciliations of VClusterClaims in Provisioning, Pending or Waking. Only those
  # VClusterClaim are polled, so this sets how fast the portal shows a cluster becoming Running.
  transitionalReconciliationInterval: 10

notifier:
  # Daily inactivity check that flags/expires unused vClusters.
  schedule: "0 3 * * *"

# Override the release-name-derived resource prefix (see templates/_helpers.tpl).
nameOverride: ""
fullnameOverride: ""
