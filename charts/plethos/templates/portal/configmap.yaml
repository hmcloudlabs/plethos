{{- /*
  The portal's admin UI edits these settings at runtime, so the chart values are only initial defaults.
*/}}
{{- $name := "plethos-portal-settings" }}
{{- $existing := lookup "v1" "ConfigMap" .Release.Namespace $name }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "plethos.labels" . | nindent 4 }}
data:
  adminEmails: {{ dig "data" "adminEmails" .Values.portal.settings.adminEmails $existing | quote }}
  maxVclustersPerUser: {{ dig "data" "maxVclustersPerUser" .Values.portal.settings.maxVclustersPerUser $existing | quote }}
  maxTeamSize: {{ dig "data" "maxTeamSize" .Values.portal.settings.maxTeamSize $existing | quote }}
