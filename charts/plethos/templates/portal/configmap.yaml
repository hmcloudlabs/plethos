apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "plethos.portal.fullname" . }}-settings
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "plethos.labels" . | nindent 4 }}
data:
  adminEmails: {{ .Values.portal.settings.adminEmails | quote }}
  maxVclustersPerUser: {{ .Values.portal.settings.maxVclustersPerUser | quote }}
  maxTeamSize: {{ .Values.portal.settings.maxTeamSize | quote }}
