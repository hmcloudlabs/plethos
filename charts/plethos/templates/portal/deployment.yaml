apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "plethos.portal.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "plethos.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.portal.replicas }}
  selector:
    matchLabels:
      app: {{ include "plethos.portal.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "plethos.portal.fullname" . }}
    spec:
      serviceAccountName: {{ include "plethos.portal.fullname" . }}
      containers:
        - name: portal
          image: "{{ .Values.portal.image.repository }}:{{ .Values.portal.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.portal.image.pullPolicy }}
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
          env:
            {{- include "plethos.portal.env" . | nindent 12 }}
