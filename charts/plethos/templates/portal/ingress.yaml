{{- if .Values.portal.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "plethos.portal.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "plethos.labels" . | nindent 4 }}
spec:
  {{- if .Values.portal.ingress.className }}
  ingressClassName: {{ .Values.portal.ingress.className }}
  {{- end }}
  rules:
    - host: {{ required "portal.ingress.host is required" .Values.portal.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "plethos.portal.fullname" . }}
                port:
                  number: 80
{{- end }}
