apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "plethos.portal.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "plethos.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "plethos.portal.fullname" . }}
  labels:
    {{- include "plethos.labels" . | nindent 4 }}
rules:
  - apiGroups: ["plethos.cs.hm.edu"]
    resources: ["vclusterclaims", "vclusterclaims/status"]
    verbs: ["get", "list", "create", "patch", "update", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["{{ include "plethos.portal.fullname" . }}-settings"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "plethos.portal.fullname" . }}
  labels:
    {{- include "plethos.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "plethos.portal.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "plethos.portal.fullname" . }}
    namespace: {{ .Release.Namespace }}
