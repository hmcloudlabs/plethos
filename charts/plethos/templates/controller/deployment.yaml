apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "plethos.controller.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "plethos.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.controller.replicas }}
  selector:
    matchLabels:
      app: {{ include "plethos.controller.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "plethos.controller.fullname" . }}
    spec:
      serviceAccountName: {{ include "plethos.controller.fullname" . }}
      containers:
        - name: controller
          image: "{{ .Values.controller.image.repository }}:{{ .Values.controller.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
          env:
            - name: VCLUSTERCLAIMS_NAMESPACE
              value: {{ .Release.Namespace }}
            {{- if .Values.baseDomain }}
            - name: BASE_DOMAIN
              value: {{ .Values.baseDomain }}
            {{- end }}
            - name: APPS_SUBDOMAIN
              value: {{ .Values.appsSubdomain | quote }}
            - name: INGRESS_NAMESPACE
              value: {{ .Values.controller.ingressNamespace }}
            - name: RECONCILIATION_INTERVAL
              value: {{ .Values.controller.reconciliationInterval | quote }}
            - name: TRANSITIONAL_RECONCILIATION_INTERVAL
              value: {{ .Values.controller.transitionalReconciliationInterval | quote }}
            - name: SUPPORTED_VCLUSTER_VERSIONS
              value: {{ .Values.supportedVclusterVersions | quote }}
