apiVersion: v1
kind: ServiceAccount
metadata:
  name: vkube-portal
  namespace: vkube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vkube-portal
rules:
  - apiGroups: ["vkube.cs.hm.edu"]
    resources: ["vclusterclaims", "vclusterclaims/status"]
    verbs: ["get", "list", "create", "patch", "update", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["vkube-portal-settings"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vkube-portal
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vkube-portal
subjects:
  - kind: ServiceAccount
    name: vkube-portal
    namespace: vkube-system
