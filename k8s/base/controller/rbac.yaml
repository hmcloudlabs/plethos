apiVersion: v1
kind: ServiceAccount
metadata:
  name: vkube-controller
  namespace: vkube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vkube-controller
rules:
  - apiGroups: ["vkube.cs.hm.edu"]
    resources: ["vclusterclaims", "vclusterclaims/status"]
    verbs: ["get", "list", "watch", "patch", "update", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vkube-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vkube-controller
subjects:
  - kind: ServiceAccount
    name: vkube-controller
    namespace: vkube-system
