apiVersion: batch/v1
kind: CronJob
metadata:
  name: vkube-inactivity-check
  namespace: vkube-system
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        spec:
          serviceAccountName: vkube-portal
          restartPolicy: Never
          containers:
            - name: inactivity-check
              image: vkube-portal:latest
              imagePullPolicy: IfNotPresent
              command: ["python", "src/cluster_expiry_job.py"]
