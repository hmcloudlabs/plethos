apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: vclusterclaims.vkube.cs.hm.edu
spec:
  group: vkube.cs.hm.edu
  names:
    kind: VClusterClaim
    plural: vclusterclaims
    singular: vclusterclaim
    shortNames: ["vcc"]
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required: [name, ownerSubject, ownerEmail]
            properties:
              name:
                type: string
                maxLength: 63
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                x-kubernetes-validations:
                - rule: self == oldSelf
                  message: name is immutable
              ownerSubject:
                type: string
                x-kubernetes-validations:
                - rule: self == oldSelf
                  message: ownerSubject is immutable
              ownerEmail:
                type: string
                x-kubernetes-validations:
                - rule: self == oldSelf
                  message: ownerEmail is immutable
              vClusterVersion:
                type: string
                # Format only. The controller gates the actually supported versions via the SUPPORTED_VCLUSTER_VERSIONS.
                pattern: ^\d+\.\d+\.\d+$
                default: "0.35.0"
                x-kubernetes-validations:
                - rule: self == oldSelf
                  message: vClusterVersion is immutable
              state:
                type: string
                enum: [Running, Sleeping]
                default: Running
              accessRules:
                type: array
                items:
                  type: object
                  required: [subject, role]
                  properties:
                    subject:
                      type: object
                      required: [sub, email]
                      properties:
                        sub:
                          type: string
                        email:
                          type: string
                    role:
                      type: string
                      enum: [admin, viewer]
          status:
            type: object
            properties:
              phase:
                type: string
                enum: [Pending, Provisioning, Ready, Sleeping, Waking, Error, Deleting]
              message:
                type: string
              observedGeneration:
                type: integer
                format: int64
              conditions:
                type: array
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys: [type]
                items:
                  type: object
                  required: [type, status, lastTransitionTime, reason, message]
                  properties:
                    type:
                      type: string
                    status:
                      type: string
                      enum: ["True", "False", "Unknown"]
                    lastTransitionTime:
                      type: string
                      format: date-time
                    reason:
                      type: string
                    message:
                      type: string
                    observedGeneration:
                      type: integer
                      format: int64
                      minimum: 0
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: Cluster
      type: string
      jsonPath: .spec.name
    - name: Owner
      type: string
      jsonPath: .spec.ownerEmail
    - name: State
      type: string
      jsonPath: .spec.state
    - name: Phase
      type: string
      jsonPath: .status.phase
    - name: Ready
      type: string
      jsonPath: .status.conditions[?(@.type=="Ready")].status
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
