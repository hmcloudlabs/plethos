apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: vkube-system

# Dummy image urls for now
images:
  - name: vkube-portal
    newName: some.registry.com/vkube-portal
    newTag: "1.0.0"
  - name: vkube-controller
    newName: some.registry.com/vkube-controller
    newTag: "1.0.0"

patches:
  - path: ingress-patch.yaml
  - path: configmap-patch.yaml
  - path: controller-env-patch.yaml
  - path: portal-env-patch.yaml
