[project]
name = "controller"
dynamic = ["version"]
description = "KOPF-based Kubernetes operator for the VClusterClaim CRD"
requires-python = ">=3.12"
dependencies = [
    "shared",
    "kopf>=1.37",
    "kubernetes>=30",
]

[tool.uv]
package = false

[tool.uv.sources]
shared = { workspace = true }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
env = [
    "VCLUSTERCLAIMS_NAMESPACE=testing-namespace",
    "RECONCILIATION_INTERVAL=5",
    "TRANSITIONAL_RECONCILIATION_INTERVAL=5",
    "EXPOSED_APPS_BASE_DOMAIN=apps.test.com",
    "TEST_TIMEOUT=90"
]

[dependency-groups]
dev = [
    "pytest-env>=1.6.0",
]
