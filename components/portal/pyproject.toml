[project]
name = "portal"
version = "0.1.0"
description = "vkube portal: FastAPI application serving templated HTMX pages"
requires-python = ">=3.12"
dependencies = [
    "shared",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "authlib>=1.3",
    "httpx>=0.27",
    "kubernetes>=30",
    "markdown>=3.7",
]

[tool.uv]
package = false

[tool.uv.sources]
shared = { workspace = true }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
