{% macro toast(message, level) %}
{% set variant = {"error": "danger", "warning": "warning", "success": "success"}[level] %}
<div class="toast text-bg-{{ variant }}" role="alert" aria-live="assertive" aria-atomic="true">
  <div class="d-flex">
    <div class="toast-body">{{ message }}</div>
    <button type="button" class="btn-close btn-close-white me-3 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
  </div>
</div>
{% endmacro %}
