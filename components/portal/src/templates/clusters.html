{% extends "base.html" %}

{% block content %}
<div class="d-flex align-items-center justify-content-between mb-3">
  <h1 class="h4 mb-0">My Clusters</h1>
</div>

{% if error %}
<div class="alert alert-danger" role="alert">{{ error }}</div>
{% endif %}

<form method="post" action="/clusters" class="card card-body mb-4">
  <div class="row g-2 align-items-end">
    <div class="col-sm-9">
      <label for="name" class="form-label">Cluster name</label>
      <input
        type="text"
        id="name"
        name="name"
        class="form-control"
        required
        maxlength="63"
        pattern="[a-z0-9]([-a-z0-9]*[a-z0-9])?"
        title="Lowercase letters, digits and hyphens"
        placeholder="e.g. dev"
        value="{{ form_name or '' }}"
      />
    </div>
    <div class="col-sm-3">
      <button type="submit" class="btn btn-primary w-100">Create cluster</button>
    </div>
  </div>
</form>

{% include "components/cluster_list.html" %}
{% endblock %}
