{% extends "base.html" %}
{% from "components/icons.html" import icon %}

{% block content %}
<div class="d-flex align-items-center justify-content-between mb-4">
  <h1 class="h3 fw-bold mb-0">Manage Clusters</h1>
</div>

{% if error %}
<div class="alert alert-danger alert-dismissible" role="alert">
  {{ error }}
</div>
{% endif %}

<div class="bento bento--pad mb-4">
  <span class="bento__label">New cluster</span>
  <form method="post" action="/clusters" class="d-flex flex-wrap align-items-end gap-2 mt-2">
    <div style="flex: 0 1 22rem;">
      <input
        type="text"
        id="name"
        name="name"
        class="form-control"
        required
        maxlength="63"
        pattern="[a-z0-9]([-a-z0-9]*[a-z0-9])?"
        title="Lowercase letters, digits and hyphens"
        placeholder="Enter a name for your cluster..."
        value="{{ form_name or '' }}"
      />
    </div>
    <button type="submit" class="btn btn-primary">{{ icon("plus") }} Create cluster</button>
  </form>
</div>

<div class="bento">
  {% include "components/cluster_list.html" %}
</div>
{% endblock %}
