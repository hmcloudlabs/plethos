[project]
name = "shared"
version = "0.1.0"
description = "Shared models and utilities for the plethos portal and controller"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shared"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
