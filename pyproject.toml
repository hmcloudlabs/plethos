[tool.uv.workspace]
members = ["components/portal", "components/controller", "components/shared"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8",
    "pyright[nodejs]>=1.1.414",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["components/portal/src", "components/controller/src", "components/shared/src"]

[tool.pyright]
venvPath = "."
venv = ".venv"

# Only the workspace members, so `uv run pyright` checks the same files in CI as it does
# locally, regardless of what else is lying around the working tree (e.g. a vcluster-api clone).
include = ["components"]

[[tool.pyright.executionEnvironments]]
root = "components/portal"
extraPaths = ["components/portal/src"]

[[tool.pyright.executionEnvironments]]
root = "components/controller"
extraPaths = ["components/controller/src"]

[[tool.pyright.executionEnvironments]]
root = "components/shared"
extraPaths = ["components/shared/src"]
