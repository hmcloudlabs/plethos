when:
  - event: pull_request
    branch: main
  - event: manual

variables:
  - &uv_image ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  - &uv_env
    UV_CACHE_DIR: /woodpecker/.uv-cache
  - &registry_env
    CODEBERG_USER:
      from_secret: codeberg_user
    CODEBERG_TOKEN:
      from_secret: codeberg_token
  - &kaniko_settings
    registry: codeberg.org
    username:
      from_secret: codeberg_user
    password:
      from_secret: codeberg_token

steps:
  # Runs first on a release so mismatched versions or a missing CHANGELOG entry fail before anything is built
  prepare-release:
    image: alpine:3.20
    when:
      - event: manual
    commands:
      - . .woodpecker/release-helpers.sh
      - release_version > .release-version
      - echo "$(cat .release-version),latest" > .tags

  lint:
    image: *uv_image
    environment: *uv_env
    commands:
      - uv sync --frozen --all-packages
      - uv run ruff check .
      - uv run ruff format --check .
      - uv run pyright

  test-shared:
    image: *uv_image
    environment: *uv_env
    commands:
      - uv sync --frozen --all-packages
      - cd components/shared && uv run pytest

  test-portal:
    image: *uv_image
    environment: *uv_env
    commands:
      - uv sync --frozen --all-packages
      - cd components/portal && uv run pytest

  test-controller:
    image: *uv_image
    environment:
      <<: *uv_env
      K3S_VERSION: "v1.36.5+k3s1"
    commands:
      - python3 -c "import urllib.request; urllib.request.urlretrieve('https://github.com/k3s-io/k3s/releases/download/$K3S_VERSION/k3s', '/usr/local/bin/k3s')"
      - chmod +x /usr/local/bin/k3s
      - uv sync --frozen --all-packages
      - cd components/controller && uv run pytest

  build-portal:
    image: woodpeckerci/plugin-kaniko:2.3.3
    when:
      - event: manual
    settings:
      <<: *kaniko_settings
      repo: ${CI_REPO_OWNER,,}/plethos-portal
      dockerfile: components/portal/Dockerfile

  build-controller:
    image: woodpeckerci/plugin-kaniko:2.3.3
    when:
      - event: manual
    settings:
      <<: *kaniko_settings
      repo: ${CI_REPO_OWNER,,}/plethos-controller
      dockerfile: components/controller/Dockerfile

  build-chart:
    image: alpine/helm:3.15.4
    environment: *registry_env
    when:
      - event: manual
    commands:
      - . .woodpecker/release-helpers.sh
      - VERSION=$(cat .release-version)
      - helm lint charts/plethos
      - helm package charts/plethos --destination /tmp/chart-out
      - echo "$CODEBERG_TOKEN" | helm registry login "$REGISTRY" --username "$CODEBERG_USER" --password-stdin
      - helm push "/tmp/chart-out/plethos-$VERSION.tgz" "oci://$REGISTRY_IMAGE"

  release:
    image: alpine:3.20
    environment: *registry_env
    when:
      - event: manual
    commands:
      - apk add --no-cache curl jq
      - . .woodpecker/release-helpers.sh
      - create_release "$(cat .release-version)"
