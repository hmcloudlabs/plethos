when:
  - event: pull_request
    branch: main
  - event: manual

variables:
  - &uv_image ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  - &uv_env
    UV_CACHE_DIR: /woodpecker/.uv-cache

steps:
  lint:
    image: *uv_image
    environment: *uv_env
    commands:
      - uv sync --frozen --all-packages
      - uv run ruff check .
      - uv run ruff format --check .
      - uv run pyright

  test-shared:
    image: *uv_image
    environment: *uv_env
    commands:
      - uv sync --frozen --all-packages
      - cd components/shared && uv run pytest

  # Portal tests only run when either something in the portal or shared changed
  test-portal:
    image: *uv_image
    environment: *uv_env
    when:
      - event: pull_request
        path:
          - components/portal/**
          - components/shared/**
          - pyproject.toml
          - uv.lock
          - .woodpecker/ci.yaml
      - event: manual
    commands:
      - uv sync --frozen --all-packages
      - cd components/portal && uv run pytest

  # Portal tests only run when either something in the controller or shared changed
  test-controller:
    image: *uv_image
    environment:
      <<: *uv_env
      K3S_VERSION: "v1.36.5+k3s1"
    when:
      - event: pull_request
        path:
          - components/controller/**
          - components/shared/**
          - charts/plethos/crds/**
          - pyproject.toml
          - uv.lock
          - .woodpecker/ci.yaml
      - event: manual
    commands:
      - python3 -c "import urllib.request; urllib.request.urlretrieve('https://github.com/k3s-io/k3s/releases/download/$K3S_VERSION/k3s', '/usr/local/bin/k3s')"
      - chmod +x /usr/local/bin/k3s
      - uv sync --frozen --all-packages
      - cd components/controller && uv run pytest
